# OpenOCD configuration for Clone / Fake / Counterfeit STM32F103C8T6 (Blue Pill)
# Supports genuine ST (0x1ba01477) AND clones like CKS32, CS32, APM32, Geehy (0x2ba01477)

source [find interface/stlink.cfg]

transport select hla_swd

# Accept genuine STM32 (0x1ba01477) OR clone chips (0x2ba01477)
set CPUTAPID 0x2ba01477

# Alternatively, set to 0 to accept ANY chip ID:
# set CPUTAPID 0

source [find target/stm32f1x.cfg]

# Blue pill clone reset fix: use software system reset instead of SRST line
reset_config none
